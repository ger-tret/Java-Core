server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: payment-service

  retry:
    enabled: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
    topics:
      order-created: order-created

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/payment_db}
      database: ${SPRING_DATA_MONGODB_DATABASE:payment_db}
      auto-index-creation: true

  liquibase:
    change-log: classpath:/db/db_master.xml
    enabled: true

external:
  payment:
    service:
      url: https://www.randomnumberapi.com/api/v1.0/random?min=100&max=1000&count=1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false